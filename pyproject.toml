[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dpt"
version = "0.1.0"
description = "SiC MOSFET double-pulse test characterisation in simulation (onsemi EliteSiC M3S models, LTspice)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
    "black==26.10.1",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# Typographic characters (µ, Ω, −, ×) are intentional in generated README text.
ignore = ["RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
