# Runs the simulator-independent checks: lint, formatting and unit tests.
# The LTspice study itself needs the vendor-encrypted onsemi models and LTspice,
# which cannot be redistributed or installed on a hosted runner; it is run locally
# with `python -m dpt.run_all` and its outputs (results/, docs/figures/) are committed.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          black --check src tests scripts
      - name: Unit tests
        run: pytest -q
